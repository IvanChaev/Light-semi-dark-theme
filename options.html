<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="ui.css">
<style>
  body { max-width: 420px; margin: 0 auto; }
  textarea { width: 100%; height: 220px; }
  #status { margin-left: 8px; }
</style>
</head>
<body>
  <h3>Smart Dark Gray — исключенные сайты</h3>
  <p>По одному домену на строку, например: <code>example.com</code>. Поддомены (например <code>m.example.com</code>) исключаются автоматически.</p>
  <textarea id="list" placeholder="example.com&#10;another-site.org"></textarea><br>
  <button id="save">Сохранить</button>
  <span id="status"></span>
  <script src="options.js"></script>
</body>
</html>
